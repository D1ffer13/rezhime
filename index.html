<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1220"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Режим"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png">
<title>Мой режим</title>
<style>
:root{--bg:#0f1220;--card:#181c30;--card2:#20253d;--t:#eef0ff;--m:#8b90b3;--a:#7c5cff;--g:#22c55e;--r:#ff4f6d;--y:#ffb020}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#151935,#0f1220);padding:14px 16px 10px;padding-top:calc(14px + env(safe-area-inset-top))}
.lvl{display:flex;align-items:center;gap:12px}.badge{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--a),#ff4fd8);display:grid;place-items:center;font-weight:800;font-size:18px}
.bar{height:8px;background:#2a3050;border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--a),#ff4fd8);border-radius:9px;transition:width .4s}
.bar.g>i{background:linear-gradient(90deg,#16a34a,#4ade80)}
main{padding:12px 14px}.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:4px 0 10px}h3{font-size:15px;margin:0 0 8px}.muted{color:var(--m);font-size:13px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.ev{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--card2);margin-bottom:8px;border-left:4px solid var(--c)}
.ev.done{opacity:.5}.ev.done .tt{text-decoration:line-through}.ev.now{outline:2px solid var(--a)}
.chk{width:30px;height:30px;border-radius:10px;border:2px solid #444b75;display:grid;place-items:center;font-size:16px;flex:none;background:none;color:#fff}
.done .chk,.chk.on{background:var(--g);border-color:var(--g)}
.time{font-weight:700;min-width:48px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--a);border:0;border-radius:12px;padding:10px 14px;font-weight:600}.btn.s{background:var(--card2)}.btn.r{background:var(--r)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.btns .btn{flex:1;padding:10px 6px}
nav{position:fixed;bottom:0;left:0;right:0;background:#121629;display:flex;border-top:1px solid #23284a;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:9px 0 10px;color:var(--m);font-size:11px}nav button b{display:block;font-size:21px}nav button.on{color:var(--t)}
.big{font-size:28px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:14px;padding:12px}.stat .big{font-size:22px}
.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{padding:6px 10px;border-radius:10px;background:var(--card2);border:0;font-size:13px}.chip.on{background:var(--a)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}#modal.on{display:flex}
#modal .sheet{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
input,select{width:100%;background:var(--card2);border:1px solid #2c3258;color:var(--t);border-radius:12px;padding:11px;font:inherit}
#toast{position:fixed;left:50%;top:20px;transform:translateX(-50%) translateY(-120px);background:#262c4d;padding:12px 18px;border-radius:14px;z-index:30;transition:.3s;max-width:90%;box-shadow:0 8px 30px #0008}#toast.on{transform:translateX(-50%) translateY(0)}
.sets{display:flex;gap:6px}.set{width:34px;height:34px;border-radius:10px;border:2px solid #444b75;background:none;font-weight:700}.set.on{background:var(--g);border-color:var(--g)}
.chart{display:flex;align-items:flex-end;gap:4px;height:110px}.chart div{flex:1;text-align:center;font-size:10px;color:var(--m)}.chart i{display:block;background:linear-gradient(180deg,var(--a),#4b37b8);border-radius:6px 6px 2px 2px;margin-bottom:4px;min-height:3px}
.ach{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #262b48}.ach.lock{opacity:.35;filter:grayscale(1)}.ach b{font-size:26px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;text-align:left;border-bottom:1px solid #262b48}tr.cur{color:var(--a);font-weight:700}
</style></head><body>
<header><div class="lvl"><div class="badge" id="hLvl">1</div><div class="sp"><div class="row"><b id="hTitle">Новичок</b><span class="sp"></span><span class="muted" id="hXp"></span></div><div class="bar" style="margin-top:6px"><i id="hBar"></i></div></div><div style="text-align:center"><div style="font-size:20px">🔥</div><b id="hStreak">0</b></div></div></header>
<main id="view"></main>
<nav id="nav"><button data-v="today" class="on"><b>📅</b>Сегодня</button><button data-v="plan"><b>🗓️</b>Расписание</button><button data-v="train"><b>💪</b>Тренировки</button><button data-v="food"><b>🍽️</b>Еда</button><button data-v="stats"><b>🏆</b>Прогресс</button></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div><div id="toast"></div>
<script>
const DN=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],ORD=[1,2,3,4,5,6,0],ALL=[0,1,2,3,4,5,6],WD=[1,2,3,4,5];
const TY={work:['Работа','💼','#4f8cff'],food:['Еда','🍽️','#ffb020'],sport:['Тренировка','💪','#ff4f6d'],task:['Дело','✅','#22c55e'],rest:['Отдых/сон','😴','#a78bfa']};
const RANKS=['Новичок','Ученик','Боец','Воин','Ветеран','Чемпион','Мастер','Легенда','Титан'];
const uid=()=>Math.random().toString(36).slice(2,9);
const key=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const parse=k=>{const[a,b,c]=k.split('-');return new Date(+a,b-1,+c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mins=t=>{const[h,m]=t.split(':');return h*60+ +m};
const fmt=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function def(){const e=(title,time,dur,type,days,remind,sat)=>({id:uid(),title,time,dur,type,days,remind,sat});return{v:2,start:key(),goal:68,satWork:{},body:[{d:key(),w:62}],
events:[e('Подъём + стакан воды','07:30',5,'task',ALL,0),e('Зарядка 5 минут','07:35',5,'sport',ALL,5),e('Завтрак','07:50',25,'food',ALL,5),e('Работа','09:00',540,'work',WD,15),e('Работа (рабочая суббота)','09:00',540,'work',[6],15,1),e('Обед на работе','13:00',60,'food',WD,10),e('Обед','13:00',60,'food',[6,0],10),e('Перекус: орехи, банан, йогурт','16:00',10,'food',WD,5),e('Ужин','18:30',30,'food',ALL,10),e('Тренировка (турники / дома)','19:30',45,'sport',[1,3,5],15),e('Растяжка после тренировки','20:20',10,'sport',[1,3,5],0),e('Перед сном: кефир или творог','22:15',10,'food',ALL,0),e('Отбой','23:00',0,'rest',ALL,30),e('Взвеситься и замеры','08:15',5,'task',[0],0)],
daily:[{id:'push',name:'Отжимания',base:50,step:5},{id:'squat',name:'Приседания',base:40,step:5}],
wkDays:[1,3,5],sets:3,
wk:[{id:'burpee',n:'Бёрпи',b:8,s:1,u:'раз'},{id:'lunge',n:'Выпады (на ногу)',b:10,s:1,u:'раз'},{id:'dips',n:'Обратные отжимания от стула',b:10,s:1,u:'раз'},{id:'bridge',n:'Ягодичный мост',b:15,s:2,u:'раз'},{id:'crunch',n:'Скручивания',b:15,s:2,u:'раз'},{id:'plank',n:'Планка',b:30,s:5,u:'сек'}],
wkB:[{id:'pull',n:'Подтягивания',b:4,s:.5,u:'раз'},{id:'dipb',n:'Отжимания на брусьях',b:6,s:1,u:'раз'},{id:'leg',n:'Подъём ног в висе',b:8,s:1,u:'раз'},{id:'row',n:'Подтягивания обратным хватом',b:3,s:.5,u:'раз'},{id:'pushn',n:'Узкие отжимания',b:10,s:1,u:'раз'},{id:'plank',n:'Планка',b:30,s:5,u:'сек'}],
log:{},notified:{}}}
let S;try{S=JSON.parse(localStorage.rezhim)}catch(e){}if(!S)S=def();else if(!S.v){const o=S;S=def();S.log=o.log||{};S.start=o.start||S.start}
const save=()=>{localStorage.rezhim=JSON.stringify(S);head()};
const L=k=>S.log[k]||(S.log[k]={done:{},reps:{},sets:{}});
const week=(k)=>Math.max(1,Math.floor((parse(k||key())-parse(S.start))/864e5/7)+1);
const target=(x,w)=>x.base+x.step*(w-1);
const wtarget=(x,w)=>Math.floor(x.b+x.s*(w-1));const wkList=k=>(L(k).mode||'bars')=='bars'?S.wkB:S.wk;
const evFor=k=>{const d=parse(k).getDay();return S.events.filter(e=>e.days.includes(d)&&(!e.sat||(S.satWork||{})[k])).sort((a,b)=>mins(a.time)-mins(b.time))};
const isWk=k=>S.wkDays.includes(parse(k).getDay());
function dayPct(k){const l=S.log[k];if(!l)return 0;const w=week(k);let p=[];evFor(k).forEach(e=>p.push(l.done[e.id]?1:0));S.daily.forEach(x=>p.push(Math.min(1,(l.reps[x.id]||0)/target(x,w))));if(isWk(k)){const W=wkList(k);p.push(W.reduce((a,x)=>a+(l.sets[x.id]||0),0)/(W.length*S.sets))}p.push(Math.min(1,(l.water||0)/8));return p.length?p.reduce((a,b)=>a+b,0)/p.length:0}
function dayXp(k){const l=S.log[k],w=week(k);let x=Object.values(l.done).filter(Boolean).length*10;S.daily.forEach(d=>{const r=l.reps[d.id]||0;x+=Math.min(r,target(d,w)*2);if(r>=target(d,w))x+=30});const W=wkList(k);let s=W.reduce((a,e)=>a+(l.sets[e.id]||0),0);x+=s*5+(l.water||0)*5+(l.boss?200:0);if(isWk(k)&&s>=W.length*S.sets)x+=60;if(dayPct(k)>=.999)x+=50;return x}
const totalXp=()=>Object.keys(S.log).reduce((a,k)=>a+dayXp(k),0);
function lvl(xp){let l=1,need=300;while(xp>=need){xp-=need;l++;need=300+l*100}return{l,cur:xp,need}}
function ok(k){return dayPct(k)>=.7||!!(S.log[k]&&S.log[k].freeze)}
function streak(){let n=0,d=new Date();if(!ok(key(d)))d=addD(d,-1);while(ok(key(d))){n++;d=addD(d,-1)}return n}
const sumReps=id=>Object.values(S.log).reduce((a,l)=>a+(l.reps[id]||0),0);
function head(){const v=lvl(totalXp());hLvl.textContent=v.l;hTitle.textContent=RANKS[Math.min(RANKS.length-1,Math.floor((v.l-1)/3))]+' · ур. '+v.l;hXp.textContent=v.cur+'/'+v.need+' XP';hBar.style.width=(v.cur/v.need*100)+'%';hStreak.textContent=streak()}
function toast(t){const e=document.getElementById('toast');e.innerHTML=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}
let view='today';
function go(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));render();scrollTo(0,0)}
nav.onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};
function render(){document.getElementById('view').innerHTML=V[view]();head()}
const V={
today(){const k=key(),l=L(k),w=week(k),now=new Date(),nm=now.getHours()*60+now.getMinutes(),evs=evFor(k),p=Math.round(dayPct(k)*100);
let nowId=null;evs.forEach(e=>{if(mins(e.time)<=nm&&nm<mins(e.time)+Math.max(e.dur,1))nowId=e.id});
const next=evs.find(e=>mins(e.time)>nm&&!l.done[e.id]);
let h=`<div class="card"><div class="row"><div class="sp"><div class="muted">${now.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})} · неделя ${w}</div><div class="big">${p}% дня</div></div><div style="font-size:34px">${p>=100?'🏆':p>=70?'🔥':'⚡'}</div></div><div class="bar g" style="margin-top:8px"><i style="width:${p}%"></i></div>${next?`<div class="muted" style="margin-top:8px">Далее: <b style="color:var(--t)">${next.time} ${esc(next.title)}</b> (через ${mins(next.time)-nm} мин)</div>`:''}</div>`;
h+=`<div class="card"><h3>💪 Челлендж дня</h3>`+S.daily.map(x=>{const t=target(x,w),r=l.reps[x.id]||0;return`<div style="margin:10px 0 14px"><div class="row"><b>${x.name}</b><span class="sp"></span><b style="color:${r>=t?'var(--g)':'var(--t)'}">${r} / ${t}</b></div><div class="bar g" style="margin-top:6px"><i style="width:${Math.min(100,r/t*100)}%"></i></div><div class="btns">${[-5,5,10,20,25].map(n=>`<button class="btn s" onclick="rep('${x.id}',${n})">${n>0?'+':''}${n}</button>`).join('')}<button class="btn s" onclick="repAsk('${x.id}')">✏️</button></div></div>`}).join('')+`</div>`;
if(isWk(k)){const W=wkList(k),done=W.reduce((a,x)=>a+(l.sets[x.id]||0),0),all=W.length*S.sets;h+=`<div class="card row" onclick="go('train')"><div style="font-size:30px">🔥</div><div class="sp"><b>Сегодня спецтренировка</b><div class="muted">${done}/${all} подходов · нажми, чтобы открыть</div></div><b>›</b></div>`}
h+=extra(k,l);h+=`<div class="card"><h3>🕒 План на сегодня</h3>`+(evs.length?evs.map(e=>{const t=TY[e.type];return`<div class="ev ${l.done[e.id]?'done':''} ${e.id==nowId?'now':''}" style="--c:${t[2]}"><button class="chk" onclick="tog('${e.id}')">${l.done[e.id]?'✓':''}</button><div class="time">${e.time}</div><div class="sp"><div class="tt">${t[1]} ${esc(e.title)}</div><div class="muted">${e.dur?'до '+fmt(mins(e.time)+e.dur):''}${e.id==nowId?' · сейчас':''}</div></div></div>`}).join(''):'<div class="muted">Нет событий</div>')+`<button class="btn s" style="width:100%;margin-top:4px" onclick="edit()">+ Добавить событие</button></div>`;
return h},
plan(){let h=`<div class="card"><div class="row"><h2 class="sp">Расписание</h2><button class="btn" onclick="edit()">+ Событие</button></div><div class="muted">Повторяющиеся события по дням недели</div></div>`;
ORD.forEach(d=>{const evs=S.events.filter(e=>e.days.includes(d)).sort((a,b)=>mins(a.time)-mins(b.time));h+=`<div class="card"><h3>${['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'][d]}${S.wkDays.includes(d)?' · 🔥 спецтренировка':''}</h3>`+(evs.map(e=>`<div class="ev" style="--c:${TY[e.type][2]}" onclick="edit('${e.id}')"><div class="time">${e.time}</div><div class="sp">${TY[e.type][1]} ${esc(e.title)}<div class="muted">${e.dur?e.dur+' мин · ':''}🔔 ${e.remind>=0?'за '+e.remind+' мин':'выкл'}</div></div><b>›</b></div>`).join('')||'<div class="muted">Свободный день</div>')+`</div>`});
h+=`<div class="card"><h3>🔔 Напоминания и данные</h3><div class="muted">iPhone: открой в Safari → «Поделиться» → «На экран Домой», запускай с иконки и нажми «Включить уведомления» (нужен iOS 16.4+). Для надёжных напоминаний добавь расписание в Календарь (.ics).</div><div class="btns"><button class="btn" onclick="askNotif()">Включить уведомления</button><button class="btn" onclick="ics()">📆 В календарь (.ics)</button></div><div class="btns"><button class="btn s" onclick="backup()">💾 Бэкап</button><button class="btn s" onclick="restore()">📂 Восстановить</button><button class="btn r" onclick="resetAll()">Сброс</button></div></div>`;return h},
train(){const k=key(),w=week(k),l=L(k),md=l.mode||'bars';
let h=`<div class="card"><div class="row"><h2 class="sp">Программа · неделя ${w}</h2><button class="btn s" onclick="progEdit()">⚙️</button></div><div class="muted">Каждую неделю нагрузка растёт автоматически. Старт: ${parse(S.start).toLocaleDateString('ru-RU')}</div></div>`;
h+=`<div class="card"><h3>📈 Ежедневный челлендж</h3><table><tr><th>Неделя</th>${S.daily.map(x=>`<th>${x.name}</th>`).join('')}</tr>`;for(let i=Math.max(1,w-1);i<=w+4;i++)h+=`<tr class="${i==w?'cur':''}"><td>${i==w?'▶ ':''}${i}</td>${S.daily.map(x=>`<td>${target(x,i)}</td>`).join('')}</tr>`;h+=`</table><div class="muted" style="margin-top:8px">Совет: дели на подходы, например 10×10 в течение дня.</div></div>`;
h+=`<div class="card"><h3>🔥 Силовая тренировка</h3><div class="chips" style="margin-bottom:8px"><button class="chip ${md=='bars'?'on':''}" onclick="mode('bars')">🌳 Турники и брусья</button><button class="chip ${md=='home'?'on':''}" onclick="mode('home')">🏠 Дома</button></div>${md=='bars'?'<div class="muted">На улице: перчатки и тёплая куртка, разомнись заранее. Мороз/дождь — переключись на «Дома». </div>':''}<div class="muted">${S.wkDays.map(d=>DN[d]).join(', ')} · ${S.sets} круга · отдых 60 сек между упражнениями, 2 мин между кругами</div>${isWk(k)?'':'<div class="muted" style="color:var(--y);margin-top:6px">Сегодня день отдыха — можно сделать по желанию 🙂</div>'}`+wkList(k).map(x=>{const s=l.sets[x.id]||0;return`<div class="ev" style="--c:var(--r)"><div class="sp"><b>${x.n}</b><div class="muted">${S.sets} × ${wtarget(x,w)} ${x.u}</div></div><div class="sets">${Array.from({length:S.sets},(_,i)=>`<button class="set ${i<s?'on':''}" onclick="setT('${x.id}',${i})">${i+1}</button>`).join('')}</div></div>`}).join('')+`<button class="btn" style="width:100%;margin-top:6px" onclick="timer()">⏱ Таймер отдыха 60 сек</button></div>`;
h+=`<div class="card"><h3>🧘 Зарядка 5 минут (каждое утро)</h3><div class="muted">Вращения шеей, плечами, тазом (1 мин) · 30 прыжков «Джек» · 10 наклонов · 10 лёгких приседаний · кошка-корова 10 раз · планка 30 сек</div></div><div class="card"><h3>🤸 Растяжка после тренировки (5–10 мин)</h3><div class="muted">Грудь у стены 30 сек/сторона · плечи и трицепс 30 сек · вис на турнике 30 сек · квадрицепс 30 сек/нога · задняя поверхность бедра 30 сек/нога · поза ребёнка 45 сек</div></div>`;return h},
